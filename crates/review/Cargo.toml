[package]
name = "family-review"
description = "Agent proposals, review, warnings, apply/reject and read-side queries shared by the HTTP API and MCP"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
family-store = { path = "../store" }
family-families = { path = "../families" }
family-relate = { path = "../relate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
