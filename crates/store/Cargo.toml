[package]
name = "family-store"
description = "SQLite store, schema, ids, fuzzy dates and optional database protection for the family-quilt app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["sqlcipher"]
# Optional password protection (SQLCipher with a vendored OpenSSL: no system OpenSSL needed).
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
# Plain SQLite only (protected trees are refused with a clear error).
plain-only = ["rusqlite/bundled"]

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
getrandom = "0.3.4"
rusqlite = { version = "0.43", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
unicode-normalization = "0.1.26"
uuid = { version = "1", default-features = false }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.27.0"
