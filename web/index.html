<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#quilt" data-i18n="a11y.skip">Skip to the tree</a>
<header class="bar" role="toolbar" data-i18n-aria="bar.label">
  <h1 id="title" class="title">Family Tree</h1>
  <nav class="views" aria-label="views">
    <button id="nav-quilt" class="tab" aria-pressed="true" data-i18n="nav.tree">Tree</button>
    <button id="nav-people" class="tab" aria-pressed="false" data-i18n="nav.people">People</button>
    <button id="nav-review" class="tab" aria-pressed="false"><span data-i18n="nav.review">Review</span> <span id="review-badge" class="badge" hidden>0</span></button>
  </nav>
  <div class="grp tools" id="tools-quilt">
    <input id="search" type="search" class="search" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.label" autocomplete="off">
    <button id="search-case" class="btn icon" aria-pressed="false" data-i18n-title="search.case" data-i18n-aria="search.case">Aa</button>
    <button id="search-literal" class="btn icon" aria-pressed="true" data-i18n-title="search.literal" data-i18n-aria="search.literal">“ ”</button>
    <button id="search-prev" class="btn icon" data-i18n-aria="search.prev" data-i18n-title="search.prev">↑</button>
    <button id="search-next" class="btn icon" data-i18n-aria="search.next" data-i18n-title="search.next">↓</button>
    <span id="search-count" class="muted" aria-live="polite"></span>
    <select id="label-mode" class="btn" data-i18n-aria="label.mode">
      <option value="full" data-i18n="label.full">Name</option>
      <option value="surname" data-i18n="label.surname">Surname</option>
      <option value="given" data-i18n="label.given">Given name</option>
    </select>
    <select id="layout-mode" class="btn" data-i18n-aria="layout.mode">
      <option value="tree" data-i18n="layout.tree">Tree by tree</option>
      <option value="layer" data-i18n="layout.layer">Generation by generation</option>
    </select>
    <button id="hl-mode" class="btn" data-i18n-title="hl.title"></button>
    <button id="hl-blood" class="btn" aria-pressed="true"></button>
    <button id="outlines" class="btn icon" aria-pressed="true" data-i18n-title="outlines.title" data-i18n-aria="outlines.title">A</button>
  </div>
  <div class="grp">
    <button id="zoom-out" class="btn icon" data-i18n-aria="zoom.out" data-i18n-title="zoom.out">−</button>
    <button id="zoom-in" class="btn icon" data-i18n-aria="zoom.in" data-i18n-title="zoom.in">+</button>
    <button id="fit" class="btn" data-i18n="zoom.fit">Fit</button>
    <button id="export" class="btn" data-i18n="export.menu">Export</button>
    <button id="settings" class="btn" data-i18n="settings.open">Settings</button>
  </div>
</header>

<main id="stage" class="stage">
  <div id="quilt-wrap" class="quilt-wrap">
    <canvas id="quilt" role="img" data-i18n-aria="quilt.label"></canvas>
    <canvas id="minimap" class="minimap" width="200" height="140" data-i18n-aria="minimap.label"></canvas>
    <div id="legend" class="legend"></div>
    <div id="tip" class="tip" hidden></div>
    <div id="empty" class="empty" hidden>
      <h2 data-i18n="empty.title">No people yet</h2>
      <p data-i18n="empty.body">Open a family file (GEDCOM) or add the first person.</p>
      <button id="empty-open" class="btn primary" data-i18n="empty.open">Open a file…</button>
      <button id="empty-add" class="btn" data-i18n="empty.add">Add a person</button>
    </div>
    <div id="strip" class="strip" hidden role="status">
      <span id="strip-text"></span>
      <button id="strip-keep" class="btn small" data-i18n="strip.keep">Keep current layout</button>
    </div>
    <aside id="side" class="side" hidden aria-labelledby="side-title"></aside>
  </div>

  <section id="screen-people" class="screen" hidden>
    <div class="screen-head"><input id="people-filter" type="search" class="search" data-i18n-placeholder="people.filter"><button id="people-add" class="btn primary" data-i18n="people.add">Add a person</button></div>
    <div id="people-list" class="list"></div>
  </section>

  <section id="screen-review" class="screen" hidden>
    <div id="review-root"></div>
  </section>
</main>

<dialog id="dlg-settings" class="dlg"></dialog>
<dialog id="dlg-export" class="dlg"></dialog>
<dialog id="dlg-person" class="dlg"></dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
