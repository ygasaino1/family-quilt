name: Windows build

# Builds the app with its window on a real Windows machine (the one thing the Linux sandbox cannot do), runs the
# tests, checks the exe needs no extra DLLs, and smoke-tests it in a folder with Persian letters in its name.
on:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.*', 'web/**', 'tools/app-smoke.py', '.cargo/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Tests (everything except the window)
        run: cargo test --workspace
      - name: Build the release exe with the window
        run: cargo build --release -p family-server --features window
      - name: Check what the exe depends on
        shell: bash
        run: |
          python -m pip install --quiet pefile
          python - <<'PY'
          import pefile, os, sys
          p = pefile.PE('target/release/family-app.exe')
          dlls = sorted({e.dll.decode().lower() for e in p.DIRECTORY_ENTRY_IMPORT})
          print('imports:', ', '.join(dlls))
          bad = [d for d in dlls if d.startswith(('vcruntime', 'msvcp', 'ucrtbase', 'libssl', 'libcrypto', 'webview2loader'))]
          size = os.path.getsize('target/release/family-app.exe') / 1e6
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'### family-app.exe\n\nSize: {size:.1f} MB\n\nImports: {", ".join(dlls)}\n')
          if bad:
              print('NOT self-contained:', bad); sys.exit(1)
          PY
      - name: Smoke test (headless, non-ASCII folder, password, lock)
        shell: bash
        run: python tools/app-smoke.py target/release/family-app.exe
      - name: Does the window open? (informational)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/win-data"
          target/release/family-app.exe --data "$RUNNER_TEMP/win-data" --port 18999 > "$RUNNER_TEMP/win.log" 2>&1 &
          PID=$!
          sleep 12
          cat "$RUNNER_TEMP/win.log" || true
          curl -s -o /dev/null -w "service: %{http_code}\n" http://127.0.0.1:18999/ || true
          tasklist | grep -i family-app || echo "process not running"
          taskkill //F //IM family-app.exe || true
          if ! grep -q "server on" "$RUNNER_TEMP/win.log"; then echo "the app did not start"; exit 1; fi
      - name: Assemble the portable package
        shell: bash
        run: |
          mkdir -p package/family-tree
          cp target/release/family-app.exe dist/README.txt dist/portable package/family-tree/
      - uses: actions/upload-artifact@v4
        with:
          name: family-tree-windows-portable
          path: package
